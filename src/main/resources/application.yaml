spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api-gateway

  # The client that forwards the requests. The read timeout is generous because some backend
  # requests (reports, consumption history) are slow on purpose; a service that does not even
  # accept the connection is answered 503 right away.
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:30s}

  cloud:
    gateway:
      server:
        webmvc:
          # The gateway appends the caller's address to X-Forwarded-For for the services. The
          # address is already the validated one (server.forward-headers-strategy below), so every
          # caller counts as a peer whose address may be appended.
          trusted-proxies: ".*"

server:
  # 8080 is the address the web and mobile clients already use. energy-monitor-backend moves to
  # 8083, the security service stays on 8082, the device service is on 8084, the measurement
  # service on 8085, the home service on 8086, the notification service on 8087 and the alert
  # service on 8088.
  port: ${SERVER_PORT:8080}
  # Behind nginx the connection comes from the proxy; the container takes the caller's address
  # from X-Forwarded-For only when the proxy is a trusted one. The rate limit counts on that
  # address.
  forward-headers-strategy: native
  tomcat:
    # Only loopback (the gateway or nginx on this machine) and the Docker networks may set it: the
    # default would trust every private network, and a machine of the LAN could then pass as
    # 127.0.0.1.
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

gateway:
  routes:
    security-service-url: ${SECURITY_SERVICE_URL:http://localhost:8082}
    device-service-url: ${DEVICE_SERVICE_URL:http://localhost:8084}
    measurement-service-url: ${MEASUREMENT_SERVICE_URL:http://localhost:8085}
    home-service-url: ${HOME_SERVICE_URL:http://localhost:8086}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    alert-service-url: ${ALERT_SERVICE_URL:http://localhost:8088}
    backend-url: ${BACKEND_URL:http://localhost:8083}
  # POSTs per client address and path to the public account endpoints (sign in, registration,
  # recovery, verification). The security service keeps its own limit on recovery codes.
  rate-limit:
    requests: ${GATEWAY_RATE_LIMIT_REQUESTS:20}
    window: ${GATEWAY_RATE_LIMIT_WINDOW:1m}

security:
  jwt:
    # Same issuer the security service signs with.
    issuer: https://energy-monitor-backend
    # The public key of the security service, the same file it is given. The path must be
    # absolute: Java does not expand ~.
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

  cors:
    # The origins allowed to call the API from a browser, comma separated. Empty by default, which
    # means no cross-origin caller is answered: fail closed until a deployment names its own.
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: false
    max-age: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
